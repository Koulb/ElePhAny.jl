      {"id":"ion_velocities","type":"select","options":["default", "from_input"],"default":"default","required":false,"desc":"Initial ionic velocities. Available options are:\n'default' :\nstart a new simulation from random thermalized\ndistribution of velocities if tempw is set, with zero velocities otherwise; restart from atomic velocities read from the restart file\n\n'from_input' :\nstart or continue the simulation with atomic velocities read from standard input - see card ATOMIC_VELOCITIES"},
      {"id":"ion_dynamics","type":"select","options":["bfgs", "damp", "fire", "verlet", "velocity-verlet", "langevin", "langevin-smc", "beeman"],"default":null,"required":false,"desc":"Specify the type of ionic dynamics.\n\nFor different type of calculation different possibilities are allowed and different default values apply:\n------------------CASE (calculation == 'relax' )\n\n'bfgs' :\n(default) use BFGS quasi-newton algorithm, based on the trust radius procedure, for structural relaxation\n\n'damp' :\nuse damped (quick-min Verlet) dynamics for structural relaxation\nCan be used for constrained optimisation: see CONSTRAINTS card\n\n'fire' :\nuse the FIRE minimization algorithm employing the semi-implicit Euler integration scheme see:\n Bitzek et al.,PRL, 97, 170201, (2006), doi: 10.1103/PhysRevLett.97.170201\n Guenole et al.,CMS, 175, 109584, (2020), doi: 10.1016/j.commatsci.2020.109584\n\nCan be used for constrained optimisation: see CONSTRAINTS card \n\n------------------CASE (calculation == 'md')\n\n'verlet' :\n(default) use Verlet algorithm to integrate Newton's equation. For constrained dynamics, see CONSTRAINTS card \
	  \n\n'velocity-verlet' :\nuse velocity-Verlet algorithm to integrate Newton's equation. For constrained dynamics, see CONSTRAINTS card.\n\n 'langevin' :\nion dynamics is over-damped Langevin\n\n'langevin-smc' :\n over-damped Langevin with Smart Monte Carlo:\nsee R.J. Rossky, JCP, 69, 4628 (1978), doi:10.1063/1.436415\n\n------------------CASE (calculation == 'vc-relax')\n\n'bfgs' :\n(default) use BFGS quasi-newton algorithm;cell_dynamics must be 'bfgs' too\n\n'damp' :\nuse damped (Beeman) dynamics for structural relaxation\n\n------------------CASE (calculation == 'vc-md' )\n\n'beeman' :\n(default)  use Beeman algorithm to integrate Newton's equation"},
      {"id":"pot_extrapolation","type":"select","options":["none", "atomic", "first_order", "second_order"],"default":"atomic","required":false,"desc":"Used to extrapolate the potential from preceding ionic steps.\n\n'none' :\n no extrapolation\n\n'atomic' :\nextrapolate the potential as if it was a sum of atomic-like orbitals\n\n'first_order' :\nextrapolate the potential with first-order formula\n\n'second_order' :\nas above, with second order formula \n\nNote: 'first_order' and 'second-order' extrapolation make sense only for molecular dynamics calculations"},
      {"id":"wfc_extrapolation","type":"select","options":["none", "first_order", "second_order"],"default":"none","required":false,"desc":"Used to extrapolate the wavefunctions from preceding ionic steps.\n\n'none' :\n no extrapolation\n\n'first_order' :\nextrapolate the wave-functions with first-order formula.\n\n'second_order' :\nas above, with second order formula.\n\nNote: 'first_order' and 'second-order' extrapolation make sense only for molecular dynamics calculations"},
      {"id":"remove_rigid_rot","type":"bool","default":false,"required":false,"desc":"This keyword is useful when simulating the dynamics and/or the thermodynamics of an isolated system. If set to true the total torque of the internal forces is set to zero by adding new forces that compensate the spurious interaction with the periodic images. This allows for the use of smaller supercells.\n\nBEWARE: since the potential energy is no longer consistent with the forces (it still contains the spurious interaction with the repeated images), the total energy is not conserved anymore. However the dynamical and thermodynamical properties should be in closer agreement with those of an isolated system. Also the final energy of a structural relaxation will be higher, but the relaxation itself should be faster."},
      {"id":"ion_temperature","type":"select","options":["rescaling", "rescale-v", "rescale-T", "reduce-T", "nose", "berendsen", "andersen", "svr", "initial", "not_controlled"],"default":"not_controlled","required":false,"desc":"Available options are:\n\n'rescaling' :\ncontrol ionic temperature via velocity rescaling (first method) see parameters tempw, tolp, and nraise (for VC-MD only).\n\n'rescale-v' :\ncontrol ionic temperature via velocity rescaling\n(second method) see parameters tempw and nraise\n\n'rescale-T' :\nscale temperature of the thermostat every nraise steps by delta_t, starting from tempw. The temperature is controlled via velocitiy rescaling.\n\n'reduce-T' :\nreduce temperature of the thermostat every nraise steps by the (negative) value delta_t, starting from tempw. If delta_t is positive, the target temperature is augmented. The temperature is controlled via velocitiy rescaling.\n\n'nose' :\ncontrol ionic temperature using Nose-Hoover thermostat. See also parameters fnosep, tempw, nhpcl, ndega, nhptyp\n\n'berendsen' :\ncontrol ionic temperature using \"soft\" velocity - see parameters tempw and nraise \
	  \n\n'andersen' :\ncontrol ionic temperature using Andersen thermostat see parameters tempw and nraise\n\n'svr' :\n control ionic temperature using stochastic-velocity rescaling (Donadio, Bussi, Parrinello, J. Chem. Phys. 126, 014101, 2007),with parameters tempw and nraise.\n\n'initial' :\ninitialize ion velocities to temperature tempw and leave uncontrolled further on\n\n'not_controlled' :\n(default) ionic temperature is not controlled"},
      {"id":"tempw","type":"real","default":300.0,"required":false,"desc":"Starting temperature (Kelvin) in MD runs target temperature for most thermostats."},
      {"id":"fnosep","type":"real","default":1.0,"required":false,"desc":"oscillation frequency of the Nose thermostat (in THz)[note that 3 THz = 100 cm^-1], meaningful only with \"ion_temperature = 'nose'\" for Nose-Hoover chain one can set frequencies for all nhpcl thermostats ( fnosep = X Y Z etc.) If only first is set, the defaults for the others will be the same."},
      {"id":"nhpcl","type":"integer","default":1,"required":false,"desc":"number of thermostats in the Nose-Hoover chain; currently maximum allowed is 4"},
      {"id":"nhptyp","type":"integer","default":0,"required":false,"desc":"type of the \"massive\" Nose-Hoover chain thermostat:\n * nhptyp = 0 uses one NH chain for all atoms.\n * nhtyp=1 uses a NH chain per each atomic type\n * nhptyp=2 use a NH chaing per atom, this one is usefulf for extremely rapid equipartioning.\n * nhptyp =3 together with nhgrp allows fine grained thermostat control"},
      {"id":"nhgrp","label":"nhgrp(i), i=1,ntyp","type":"integer","default":0,"required":false,"desc":"specifies which thermostat group to use for given atomic type when >0 assigns all the atoms in this type to thermostat labeled nhgrp(i), when =0 each atom in the type gets its own thermostat. Finally, when <0, then this atomic type will have temperature \"not controlled\".\nExample: HCOOLi, with types H (1), C(2), O(3), Li(4);setting nhgrp={2 2 0 -1} will add a common thermostat for both H & C, one thermostat per each O (2 in total), and a non-updated thermostat for Li which will effectively make temperature for Li \"not controlled\""},
      {"id":"fnhscl","label":"fnhscl(i), i=1,ntyp","type":"real","default":null,"required":false,"desc":"these are the scaling factors to be used together with nhptyp=3 and nhgrp(i) in order to take care of possible reduction in the degrees of freedom due to constraints. Suppose that with the previous example HCOOLi, C-H bond is constrained. Then, these 2 atoms will have 5 degrees of freedom in total instead of 6, and one can set fnhscl={5/6 5/6 1. 1.}. This way the target kinetic energy for H&C will become 6(kT/2)*5/6 = 5(kT/2). This option is to be used for simulations with many constraints, such as rigid water with something else in there"},
      {"id":"ndega","type":"integer","default":0,"required":false,"desc":"number of degrees of freedom used for temperature calculation ndega <= 0 sets the number of degrees of freedom to\n[3*nat-abs(ndega)], ndega > 0 is used as the target number"},
      {"id":"tolp","type":"real","default":100.0,"required":false,"desc":"Tolerance for velocity rescaling. Velocities are rescaled if the run-averaged and target temperature differ more than tolp."},
      {"id":"delta_t","type":"real","default":1.0,"required":false,"desc":"if ion_temperature == 'rescale-T' :\n at each step the instantaneous temperature is multiplied by delta_t; this is done rescaling all the velocities.\n\nif ion_temperature == 'reduce-T' :\n every 'nraise' steps the instantaneous temperature is reduced by -delta_t (i.e. delta_t < 0 is added to T)\n\nThe instantaneous temperature is calculated at the end of every ionic move and BEFORE rescaling. This is the temperature reported in the main output.\n\nFor delta_t < 0, the actual average rate of heating or cooling should be roughly C*delta_t/(nraise*dt) (C=1 for an\nideal gas, C=0.5 for a harmonic solid, theorem of energy equipartition between all quadratic degrees of freedom)."},
      {"id":"nraise","type":"integer","default":1,"required":false,"desc":"if ion_temperature == 'reduce-T' :\n every nraise steps the instantaneous temperature is reduced by -delta_t (i.e. delta_t is added to the temperature)\n\nif ion_temperature == 'rescale-v' :\n every nraise steps the average temperature, computed from the last nraise steps, is rescaled to tempw\n\nif ion_temperature == 'rescaling' and calculation == 'vc-md' : every nraise steps the instantaneous temperature is rescaled to tempw\n\nif ion_temperature == 'berendsen' :\n the \"rise time\" parameter is given in units of the time step: tau = nraise*dt, so dt/tau = 1/nraise\n\nif ion_temperature == 'andersen' :\n the \"collision frequency\" parameter is given as nu=1/tau defined above, so nu*dt = 1/nraise\n\nif ion_temperature == 'svr' :\n the \"characteristic time\" of the thermostat is set to tau = nraise*dt"},
      {"id":"refold_pos","type":"bool","default":false,"required":false,"desc":"This keyword applies only in the case of molecular dynamics or damped dynamics. If true the ions are refolded at each step into the supercell."},
      {"id":"upscale","type":"real","default":100.0,"required":false,"desc":"Max reduction factor for conv_thr during structural optimization conv_thr is automatically reduced when the relaxation approaches convergence so that forces are still accurate,but conv_thr will not be reduced to less that conv_thr / upscale."},
      {"id":"bfgs_ndim","type":"integer","default":1,"required":false,"desc":"Number of old forces and displacements vectors used in the PULAY (GDIIS) mixing of the residual vectors obtained on the basisof the inverse hessian matrix given by the BFGS algorithm. The variable tgdiis_step in this case sets whether to use to full GDIIS step or the BFGS trust_radius. When bfgs_ndim = 1, the standard quasi-Newton BFGS method is used.\n(bfgs only)"},
      {"id":"tgdiis_step","type":"bool","default":true,"required":false,"desc":"When G-DIIS (bfgs_ndim > 1) is used for the structural relaxation this variable selects whether to use to full gdiis step or the BFGS trus radius.\n(bfgs only)"},
      {"id":"trust_radius_max","type":"real","default":0.8,"required":false,"desc":"Maximum ionic displacement in the structural relaxation.\n(bfgs only)"},
      {"id":"trust_radius_min","type":"real","default":0.001,"required":false,"desc":"Minimum ionic displacement in the structural relaxation BFGS is reset when trust_radius < trust_radius_min.\n(bfgs only)"},
      {"id":"trust_radius_ini","type":"real","default":0.5,"required":false,"desc":"Initial ionic displacement in the structural relaxation.\n(bfgs only)"},
      {"id":"w_1","type":"real","default":0.01,"required":false,"desc":"Parameters used in line search based on the Wolfe conditions.\n(bfgs only)"},
      {"id":"w_2","type":"real","default":0.5,"required":false,"desc":"Parameters used in line search based on the Wolfe conditions.\n(bfgs only)"},
      {"id":"fire_alpha_init","type":"real","default":0.2,"required":false,"desc":"Initial value of the alpha mixing factor in the FIRE minimization scheme;recommended values are between 0.1 and 0.3"},
      {"id":"fire_falpha","type":"real","default":0.99,"required":false,"desc":"Scaling of the alpha mixing parameter for steps with P > 0;"},
      {"id":"fire_nmin","type":"integer","default":5,"required":false,"desc":"Minimum number of steps with P > 0 before increase of dt"},
      {"id":"fire_f_inc","type":"real","default":1.1,"required":false,"desc":"Factor for increasing dt"},
      {"id":"fire_f_dec","type":"real","default":0.5,"required":false,"desc":"Factor for decreasing dt"},
      {"id":"fire_dtmax","type":"real","default":10.0,"required":false,"desc":"Determines the maximum value of dt in the FIRE minimization;\n dtmax = fire_dtmax*dt"},
    ]
  },

{	
	id: "CELL",
	name:"Cell",
    description: "Namelist CELL",
    params: [
      {"id":"cell_dynamics","type":"select","options":["none", "sd", "damp-pr", "damp-w", "bfgs", "pr", "w"],"default":null,"required":false,"desc":"Specify the type of dynamics for the cell.For different type of calculation different possibilities are allowed and different default values apply:\n\n------------------CASE (calculation == 'vc-relax' )\n\n'none' :\nno dynamics\n\n'sd' :\nsteepest descent ( not implemented )\n\n'damp-pr' :\ndamped (Beeman) dynamics of the Parrinello-Rahman extended lagrangian\n \n\n'damp-w' :\ndamped (Beeman) dynamics of the new Wentzcovitch extended lagrangian\n\n'bfgs' :\nBFGS quasi-newton algorithm (default)\nion_dynamics must be 'bfgs' too \n\n------------------CASE (calculation == 'vc-md' )\n\n'none' :\nno dynamics\n\n'pr' :\n(Beeman) molecular dynamics of the Parrinello-Rahman extended lagrangian\n\n'w' :\n(Beeman) molecular dynamics of the new Wentzcovitch extended lagrangian"},
      {"id":"press","type":"real","default":0.0,"required":false,"desc":"Target pressure [KBar] in a variable-cell md or relaxation run."},
      {"id":"wmass","type":"real","default":null,"required":false,"desc":"Fictitious cell mass [amu] for variable-cell simulations (both 'vc-md' and 'vc-relax').\n DEFAULT: 0.75*Tot_Mass/pi**2 for Parrinello-Rahman MD; 0.75*Tot_Mass/pi**2/Omega**(2/3) for Wentzcovitch MD"},
      {"id":"cell_factor","type":"real","default":null,"required":false,"desc":"Used in the construction of the pseudopotential tables.\nIt should exceed the maximum linear contraction of the cell during a simulation."},
      {"id":"press_conv_thr","type":"real","default":null,"required":false,"desc":"Convergence threshold on the pressure for variable cell relaxation ('vc-relax' : note that the other convergence thresholds for ionic relaxation apply as well)."},
      {"id":"cell_dofree","type":"select","options":["all", "ibrav", "a", "b", "c", "fixa", "fixb", "fixc", "x", "y", "z", "xy", "xz", "yz", "xyz", "shape", "volume", "2Dxy", "2Dshape", "epitaxial_ab", "epitaxial_ac", "epitaxial_bc"],"default":"all","required":false,"desc":"Select which of the cell parameters should be moved:\n\n'all' :\n all axis and angles are moved\n\n'ibrav' :\nall axis and angles are moved, but the lattice remains consistent with the initial ibrav choice. You can use this option in combination with any other one by specifying \"ibrav+option\". Please note that some combinations do not make sense for some crystals and will guarantee that the relax will never converge. E.g. 'ibrav+2Dxy' is not a problem for hexagonal cells, but will never converge for cubic ones.\n\n'a' :\n the x component of axis 1 (v1_x) is fixed\n\n'b' :\n the y component of axis 2 (v2_y) is fixed\n\n'c' :\n the z component of axis 3 (v3_z) is fixed\n\n'fixa' :\n axis 1 (v1_x,v1_y,v1_z) is fixed\n\n'fixb' :\n axis 2 (v2_x,v2_y,v2_z) is fixed\n\n'fixc' :\n axis 3 (v3_x,v3_y,v3_z) is fixed \
	  \n\n'x' :\nonly the x component of axis 1 (v1_x) is moved\n\n'y' :\n only the y component of axis 2 (v2_y) is moved\n\n'z' : \nonly the z component of axis 3 (v3_z) is moved\n\n'xy' :\n only v1_x and v2_y are moved       \n\n'xz' :\n only v1_x and v3_z are moved\n\n'yz' :\n only v2_y and v3_z are moved\n\n'xyz' :\n only v1_x, v2_y, v3_z are moved\n\n'shape' :\nall axis and angles, keeping the volume fixed\n\n'volume' :\nthe volume changes, keeping all angles fixed (i.e. only celldm(1) changes)\n\n'2Dxy' :\nonly x and y components are allowed to change\n\n'2Dshape' :\nas above, keeping the area in xy plane fixed\n\n'epitaxial_ab' :\nfix axis 1 and 2 while allowing axis 3 to move\n\n'epitaxial_ac' :\n fix axis 1 and 3 while allowing axis 2 to move\n\n'epitaxial_bc' :\n fix axis 2 and 3 while allowing axis 1 to move"},
    ]
  },
{
	id:"FCP",
	name:"FCP",
    description:"Input this namelist only if Control.lfcp = .TRUE.",
    params: [
      {"id":"fcp_mu","type":"real","default":null,"required":true,"desc":"The target Fermi energy (eV). One can start with appropriate total charge of the system by giving tot_charge."},
      {"id":"fcp_dynamics","type":"select","options":["bfgs", "newton", "damp", "lm", "velocity-verlet", "verlet"],"default":null,"required":false,"desc":"Specify the type of dynamics for the Fictitious Charge Particle (FCP).\nFor different type of calculation different possibilities are allowed and different default values apply:\n\n------------------CASE (calculation == 'relax' )\n\n'bfgs' :\n(default) BFGS quasi-newton algorithm, coupling with ions relaxation\nion_dynamics must be 'bfgs' too\n\n'newton' :\nNewton-Raphson algorithm with DIIS \nion_dynamics must be 'damp' too\n\n'damp' :\ndamped (quick-min Verlet) dynamics for FCP relaxation \nion_dynamics must be 'damp' too\n\n'lm' :\nLine-Minimization algorithm for FCP relaxation\nion_dynamics must be 'damp' too\n\n------------------CASE (calculation == 'md' )\n\n'velocity-verlet' :\n(default)Velocity-Verlet algorithm to integrate Newton's equation.\nion_dynamics must be 'verlet' too\n\n'verlet' :\nVerlet algorithm to integrate Newton's equation.\nion_dynamics must be 'verlet' too"},
      {"id":"fcp_conv_thr","type":"real","default":0.01,"required":false,"desc":"Convergence threshold on force (eV) for FCP relaxation."},
      {"id":"fcp_ndiis","type":"integer","default":4,"required":false,"desc":"Size of DIIS for FCP relaxation,\nused only if fcp_dynamics = 'newton'."},
      {"id":"fcp_mass","type":"real","default":null,"required":false,"desc":"Mass of the FCP. \nDEFAULT: 5.D+6 / (xy area) for ESM only; 5.D+4 / (xy area) for ESM-RISM"},
      {"id":"fcp_velocity","type":"real","default":null,"required":false,"desc":"Initial velocity of the FCP.\nDEFAULT:  determined by fcp_temperature"},
      {"id":"fcp_temperature","type":"select","options":["rescaling", "rescale-v", "rescale-T", "reduce-T", "berendsen", "andersen", "initial", "not_controlled"],"default":"ion_temperature","required":false,"desc":"Default:  IONS.ion_temperature\n Available options are:\n\n'rescaling' :\ncontrol FCP's temperature via velocity rescaling (first method) see parameters fpc_tempw and fcp_tolp.\n\n'rescale-v' :\ncontrol FCP's temperature via velocity rescaling (second method) see parameters fcp_tempw and fcp_nraise\n\n'rescale-T' :\ncontrol FCP's temperature via velocity rescaling (third method) see parameter fcp_delta_t\n\n'reduce-T' :\nreduce FCP's temperature every fcp_nraise steps by the (negative) value fcp_delta_t\n\n'berendsen' :\ncontrol FCP's temperature using \"soft\" velocity rescaling - see parameters fcp_tempw and fcp_nraise\n\n'andersen' :\ncontrol FCP's temperature using Andersen thermostat see parameters fcp_tempw and fcp_nraise\n\n'initial' :\ninitialize FCP's velocities to temperature fcp_tempw and leave uncontrolled further on\n\n'not_controlled' :\n(default) FCP's temperatur"},
      {"id":"fcp_tempw","type":"real","default":null,"required":false,"desc":"Starting temperature (Kelvin) in FCP dynamics runs target temperature for most thermostats."},
      {"id":"fcp_tolp","type":"real","default":null,"required":false,"desc":"Tolerance for velocity rescaling. Velocities are rescaled if the run-averaged and target temperature differ more than tolp."},
      {"id":"fcp_delta_t","type":"real","default":null,"required":false,"desc":"Default: IONS.delta_t \n\nif fcp_temperature == 'rescale-T' :\n at each step the instantaneous temperature is multiplied by fcp_delta_t; this is done rescaling all the velocities.\n\nif fcp_temperature == 'reduce-T' :\n every fcp_nraise steps the instantaneous temperature is reduced by -fcp_delta_t (i.e. fcp_delta_t < 0 is added to T)\n\nThe instantaneous temperature is calculated at the end of FCP's move and BEFORE rescaling. This is the temperature reported in the main output.\n\nFor fcp_delta_t < 0, the actual average rate of heating or cooling should be roughly C*fcp_delta_t/(fcp_nraise*dt) (C=1 for an ideal gas, C=0.5 for a harmonic solid, theorem of energy equipartition between all quadratic degrees of freedom)."},
      {"id":"fcp_nraise","type":"integer","default":null,"required":false,"desc":"Default: IONS.nraise \n\nif fcp_temperature == 'reduce-T' :\n every fcp_nraise steps the instantaneous temperature is reduced by -fcp_delta_t (i.e. fcp_delta_t is added to the temperature)\n\nif fcp_temperature == 'rescale-v' :\n every fcp_nraise steps the average temperature, computed from the last fcp_nraise steps, is rescaled to fcp_tempw\n\nif fcp_temperature == 'berendsen' :\n the \"rise time\" parameter is given in units of the time step: tau = fcp_nraise*dt, so dt/tau = 1/fcp_nraise\n\nif fcp_temperature == 'andersen' :\n the \"collision frequency\" parameter is given as nu=1/tau defined above, so nu*dt = 1/fcp_nraise"},
      {"id":"freeze_all_atoms","type":"bool","default":false,"required":false,"desc":"If .TRUE., freeze all atoms\nto perform relaxation or dynamics only with FCP."},
    ]
  },
	
{
	id:	"RISM",
	name:"RISM",
    description: "Input this namelist only if Control.trism = .TRUE.",
    params: [
      {"id":"nsolv","type":"integer","default":null,"required":true,"desc":"The number of solvents (i.e. molecular species) in the unit cell"},
      {"id":"closure","type":"select","options":["kh", "hnc"],"default":"kh","required":false,"desc":"Specify the type of closure equation:\n\n'kh':\nThe Kovalenko and Hirata's model.\n[A.Kovalenko, F.Hirata, JCP 110, 10095 (1999), doi:10.1063/1.478883] \n\n'hnc':\nThe HyperNetted-Chain model, which is suitable only for solvents without charge.\n[J.P.Hansen et al., Theory of simple liquids. Academic Press, London, 1990]"},
      {"id":"tempv","type":"real","default":300.0,"required":false,"desc":"Temperature (Kelvin) of solvents."},
      {"id":"ecutsolv","type":"real","default":null,"required":false,"desc":"Kinetic energy cutoff (Ry) for solvent's correlation functions.\nIf a solute is an isolated system or slab, you may allowed to use default value.\n For a frameworked or porous solute (e.g. Zeolite, MOF), it is desirable to apply a larger value.\n Solvents confined in a framework often have a high frequency."},
      {"id":"solute_lj","label":"solute_lj(i), i=1,ntyp","type":"select","options":["none", "uff", "clayff", "opls-aa"],"default":"uff","required":false,"desc":"Specify the Lennard-Jones potential of solute on atomic type 'i':\n\n'none': The Lennard-Jones potential is not specified here.You must set solute_epsilon and solute_sigma. \n\n'uff': Universal Force Field.\n[A.K.Rappe et al., JACS 144, 10024 (1992), doi:10.1021/ja00051a040] \n\n'clayff': Clay's Force Field\n[R.T.Cygan et al., JPC B 108, 1255 (2004), doi:10.1021/jp0363287]\n\n'opls-aa': OPLS-AA (generic parameters for QM/MM)"},
      {"id":"solute_epsilon","label":"solute_epsilon(i), i=1,ntyp","type":"real","default":null,"required":false,"desc":"The Lennard-Jones potential of solute on atomic type 'i'.\nHere, you can set the parameter 'epsilon' (kcal/mol)."},
      {"id":"solute_sigma","label":"solute_sigma(i), i=1,ntyp","type":"real","default":null,"required":false,"desc":"The Lennard-Jones potential of solute on atomic type 'i'.\nHere, you can set the parameter 'sigma' (Angstrom)."},
      {"id":"starting1d","type":"select","options":["zero", "file", "fix"],"default":null,"required":false,"desc":"'zero': Starting correlation functions of 1D-RISM from zero.\n( default for scf, *relax, *md )\n\n'file': Start from existing \"1d-rism_csvv_r.xml\" file in the directory specified by variables \"prefix\" and \"outdir\". \n\n'fix': Read from existing \"1d-rism_csvv_r.xml\" file in the directory specified by variables \"prefix\" and \"outdir\", and never calculate 1D-RISM. \n For nscf and bands calculation this is the default."},
      {"id":"starting3d","type":"select","options":["zero", "file"],"default":null,"required":false,"desc":"'zero': Starting correlation functions of 3D-RISM from zero.\n( default for scf, *relax, *md )\n\n'file': Start from existing \"3d-rism_csuv_r.dat\" file in the directory specified by variables \"prefix\" and \"outdir\".\nFor nscf and bands calculation this is the default."},
      {"id":"smear1d","type":"real","default":2.0,"required":false,"desc":"Coulomb smearing radius (a.u.) for 1D-RISM."},
      {"id":"smear3d","type":"real","default":2.0,"required":false,"desc":"Coulomb smearing radius (a.u.) for 3D-RISM."},
      {"id":"rism1d_maxstep","type":"integer","default":50000,"required":false,"desc":"Maximum number of iterations in a 1D-RISM step."},
      {"id":"rism3d_maxstep","type":"integer","default":5000,"required":false,"desc":"Maximum number of iterations in a 3D-RISM step."},
      {"id":"rism1d_conv_thr","type":"real","default":1e-08,"required":false,"desc":"Convergence threshold for 1D-RISM."},
      {"id":"rism3d_conv_thr","type":"real","default":null,"required":false,"desc":"Convergence threshold for 3D-RISM."},
      {"id":"mdiis1d_size","type":"integer","default":20,"required":false,"desc":"Size of Modified DIIS (MDIIS) for 1D-RISM."},
      {"id":"mdiis3d_size","type":"integer","default":10,"required":false,"desc":"Size of Modified DIIS (MDIIS) for 3D-RISM."},
      {"id":"mdiis1d_step","type":"real","default":0.5,"required":false,"desc":"Step of Modified DIIS (MDIIS) for 1D-RISM."},

    // Flatten parameters for easy access
    let allParamsMap = new Map();
    for (let section of SECTIONS) {
        for (let param of section.params) {
            allParamsMap.set(param.id, { schema: param, sectionId: section.id });
        }
    }

    // Runtime storage for parameter values
    let globalRuntime = {};

    function initParamRuntime(schema) {
        if (schema.type === "array") {
            let initialRows = [];
            if (schema.default && Array.isArray(schema.default)) {
                initialRows = schema.default.map(row => {
                    let newRow = [];
                    for (let i = 0; i < schema.ncols; i++) {
                        let val = (i < row.length) ? row[i] : "";
                        if (typeof val === 'number') newRow.push(val);
                        else newRow.push(String(val));
                    }
                    return newRow;
                });
            }
            return { rows: initialRows };
        } else if (schema.type === "select") {
            let defaultValue = schema.default !== undefined ? schema.default : (schema.options?.[0] || "");
            return { value: String(defaultValue) };
        } else if (schema.type === "bool") {
            let defaultValue = schema.default === true;
            return { value: defaultValue };
        } else if (schema.type === "real") {
            let def = schema.default !== undefined ? schema.default : 0.0;
            return { value: (typeof def === 'number') ? def : parseFloat(def) || 0.0 };
        } else if (schema.type === "integer") {
            let def = schema.default !== undefined ? schema.default : 0;
            return { value: typeof def === 'number' ? def : parseInt(def) || 0 };
        } else {
            return { value: schema.default !== undefined ? String(schema.default) : "" };
        }
    }

    for (let [paramId, { schema }] of allParamsMap.entries()) {
        globalRuntime[paramId] = initParamRuntime(schema);
    }

    // ========== CARD SELECTION STATE (always active) ==========
    let selectedCardsSet = new Set();  // stores paramId strings

    // ========== DETECT IF A SECTION HAS SELECTED PARAMETERS ==========
    // Simple function: returns true if any parameter in the given section is selected
    function sectionHasSelectedParameters(sectionId) {
        const section = SECTIONS.find(s => s.id === sectionId);
        if (!section) return false;
        // Check each parameter in the section
        for (let param of section.params) {
            if (selectedCardsSet.has(param.id)) {
                return true;
            }
        }
        return false;
    }

    // Get count of selected parameters in a section
    function getSelectedCountInSection(sectionId) {
        const section = SECTIONS.find(s => s.id === sectionId);
        if (!section) return 0;
        let count = 0;
        for (let param of section.params) {
            if (selectedCardsSet.has(param.id)) count++;
        }
        return count;
    }

    // Update sidebar section indicators based on which sections have selected parameters
    function updateSectionIndicators() {
        const sectionButtons = document.querySelectorAll('#sectionList .section-btn');
        sectionButtons.forEach(btn => {
            const sectionId = btn.dataset.sectionId;
            if (sectionId) {
                const hasSelected = sectionHasSelectedParameters(sectionId);
                if (hasSelected) {
                    btn.classList.add('has-selected');
                    // Add or update the visual dot if not present
                    let dot = btn.querySelector('.selection-dot');
                    if (!dot) {
                        dot = document.createElement('span');
                        dot.className = 'selection-dot';
                        btn.appendChild(dot);
                    }
                } else {
                    btn.classList.remove('has-selected');
                    const dot = btn.querySelector('.selection-dot');
                    if (dot) dot.remove();
                }
            }
        });
        
        // Also update current section info display
        updateCurrentSectionInfo();
    }

    // Show a summary for the current active section
    function updateCurrentSectionInfo() {
        const activeId = activeSectionId;
        if (!activeId) return;
        const selectedCount = getSelectedCountInSection(activeId);
        const infoDiv = document.getElementById('currentSectionSelectedInfo');
        if (infoDiv) {
            if (selectedCount > 0) {
                infoDiv.style.display = 'inline-flex';
                infoDiv.innerHTML = `${selectedCount} selected parameter${selectedCount !== 1 ? 's' : ''} in this section`;
            } else {
                infoDiv.style.display = 'none';
            }
        }
    }

    // Helper: update selection counter and UI elements
    function updateSelectionUI() {
        const count = selectedCardsSet.size;
        const countSpan = document.getElementById('selectedCardsCount');
        if (countSpan) countSpan.textContent = count;
        
        // Visually highlight cards that are selected
        document.querySelectorAll('.param-card').forEach(card => {
            const paramId = card.dataset.paramId;
            if (paramId && selectedCardsSet.has(paramId)) {
                card.classList.add('selected');
            } else {
                card.classList.remove('selected');
            }
        });
        
        // Update section indicators (sidebar dots + current section info)
        updateSectionIndicators();
    }

    // Toggle selection for a card given its parameter id
    function toggleCardSelection(paramId) {
        if (selectedCardsSet.has(paramId)) {
            selectedCardsSet.delete(paramId);
        } else {
            selectedCardsSet.add(paramId);
        }
        updateSelectionUI();
    }

    // Deselect all cards
    function deselectAllCards() {
        selectedCardsSet.clear();
        updateSelectionUI();
    }

    // ========== TOML GENERATION ==========
    function escapeTomlString(s) {
        return String(s).replace(/\\/g, "\\\\").replace(/"/g, '\\"').replace(/\n/g, "\\n");
    }

    function generateCleanTOML() {
        let lines = [];
        let sectionParamsMap = new Map();
        for (let [paramId, { schema, sectionId }] of allParamsMap.entries()) {
            const runtime = globalRuntime[paramId];
            if (!runtime) continue;
            if (!sectionParamsMap.has(sectionId)) sectionParamsMap.set(sectionId, []);
            sectionParamsMap.get(sectionId).push({ id: paramId, schema: schema, runtime: runtime });
        }
        for (let section of SECTIONS) {
            const params = sectionParamsMap.get(section.id);
            if (!params || params.length === 0) continue;
			
			if (sectionHasSelectedParameters(section.id)){
				lines.push(`[${section.id}]`);
				
				//Hack: hardcode this
				if(section.id =='K_POINTS'){  // add a fixed param
					lines.push(`kpoint_scheme = "automatic"`);
				}	
				
				for (let { id, schema, runtime } of params) {
					if (selectedCardsSet.has(schema.id)){
						let value;
						if (schema.type === "array") {
							const rows = runtime.rows || [];
							if (rows.length === 0) value = "[]";
							else {
								let allRowStrings = [];
								for (let row of rows) {
									let rowValues = [];
									for (let i = 0; i < schema.ncols; i++) {
										let cell = (i < row.length) ? row[i] : "";
										if (cell === "") rowValues.push('""');
										else if (typeof cell === 'number') rowValues.push(cell.toString());
										else rowValues.push(`"${escapeTomlString(String(cell))}"`);
									}
									allRowStrings.push(`[${rowValues.join(", ")}]`);
								}
								value = `[${allRowStrings.join(", ")}]`;
							}
							// rewrite Celldm was a list
			//				if(section.id =='SYSTEM' && schema.id == 'celldm' && rows.length != 0){ 
			//					for (let row of rows) {
			//						lines.push("celldm(" + `${escapeTomlString(String(row[0]))}` + ") = " + `${escapeTomlString(String(row[1]))}` );
			//					}
			//				}
			//				else {
								lines.push(`${id} = ${value}`);
				//			}
						} else if (schema.type === "bool") {
							lines.push(`${id} = ${runtime.value === true ? "true" : "false"}`);
						} else if (schema.type === "real" || schema.type === "integer") {
							let numVal = typeof runtime.value === 'number' ? runtime.value : parseFloat(runtime.value) || 0;
							lines.push(`${id} = ${numVal}`);
						} else if (schema.type === "select" || schema.type === "string") {
							lines.push(`${id} = "${escapeTomlString(String(runtime.value))}"`);
						}
					}
				}
				lines.push("");
			}
        }
        return lines.join("\n").trim();
    }

    function downloadToml() {
        const blob = new Blob([generateCleanTOML()], {type: "text/plain"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        let prefixVal = globalRuntime["prefix"]?.value || "pwscf";
        a.download = `ph_parameters_${prefixVal}.toml`;
        a.click();
        URL.revokeObjectURL(a.href);
    }

    // ========== RENDERING ==========
    function paramMatchesSearch(param, query) {
        if (!query.trim()) return true;
        const q = query.toLowerCase();
        return param.id.toLowerCase().includes(q) || (param.label && param.label.toLowerCase().includes(q)) || (param.desc && param.desc.toLowerCase().includes(q));
    }

    function getFilteredParams() {
        const section = SECTIONS.find(s => s.id === activeSectionId);
        if (!section) return [];
        return section.params.filter(p => paramMatchesSearch(p, searchQuery));
    }

    function renderParamBody(schema, runtime, container) {
        if (schema.type === "array") {
            renderArrayBody(schema, runtime, container);
        } else if (schema.type === "select") {
            const html = `<select class="select-input">${schema.options.map(opt => `<option ${runtime.value === opt ? 'selected' : ''}>${escapeHtml(opt)}</option>`).join('')}</select><div class="actions-bar"><button class="reset-btn">⟳ Reset</button></div>`;
            container.innerHTML = html;
            container.querySelector('select').addEventListener('change', (e) => { runtime.value = e.target.value; });
            container.querySelector('.reset-btn').addEventListener('click', () => { runtime.value = schema.default; renderParamBody(schema, runtime, container); });
        } else if (schema.type === "bool") {
            const val = runtime.value === true;
            const html = `<div class="bool-group"><label><input type="radio" name="bool_${schema.id}" value="true" ${val ? 'checked' : ''}> True</label><label><input type="radio" name="bool_${schema.id}" value="false" ${!val ? 'checked' : ''}> False</label></div><div class="actions-bar"><button class="reset-btn">⟳ Reset</button><button class="toggle-btn">🔄 Toggle</button></div>`;
            container.innerHTML = html;
            container.querySelectorAll(`input[name="bool_${schema.id}"]`).forEach(r => r.addEventListener('change', (e) => { if(e.target.checked) runtime.value = e.target.value === 'true'; }));
            container.querySelector('.reset-btn').addEventListener('click', () => { runtime.value = schema.default === true; renderParamBody(schema, runtime, container); });
            container.querySelector('.toggle-btn').addEventListener('click', () => { runtime.value = !runtime.value; renderParamBody(schema, runtime, container); });
        } else {
            const isReal = schema.type === "real";
            let display = isReal ? (typeof runtime.value === 'number' ? runtime.value : 0) : String(runtime.value);
            const html = `<input type="${isReal ? 'number' : 'text'}" class="scalar-input" value="${escapeHtml(String(display))}" step="${isReal ? 'any' : ''}"><div class="actions-bar"><button class="reset-btn">⟳ Reset</button></div>`;
            container.innerHTML = html;
            container.querySelector('input').addEventListener('input', (e) => {
                if (isReal) { let n = parseFloat(e.target.value); runtime.value = isNaN(n) ? 0.0 : n; }
                else runtime.value = e.target.value;
            });
            container.querySelector('.reset-btn').addEventListener('click', () => { runtime.value = schema.default; renderParamBody(schema, runtime, container); });
        }
    }
    
    function renderArrayBody(schema, runtime, container) {
        const ncols = schema.ncols;
        let rows = runtime.rows || [];
        const refresh = () => {
            let html = `<div class="array-table-wrapper"><table class="array-table"><thead><tr>${Array(ncols).fill().map((_,i)=>`<th>${escapeHtml(schema.colNames?.[i] || `Col${i+1}`)}</th>`).join('')}<th>Del</th></tr></thead><tbody>`;
            rows.forEach((row, rIdx) => {
                html += `<tr>`;
                for(let c=0; c<ncols; c++) {
                    let val = (c < row.length) ? row[c] : "";
                    html += `<td><input type="text" class="cell-input" data-row="${rIdx}" data-col="${c}" value="${escapeHtml(String(val))}"></td>`;
                }
                html += `<td><button class="remove-row-btn" data-row="${rIdx}">✖</button></tr>`;
            });
            html += `</tbody></table></div><div class="actions-bar"><button class="add-row-btn btn-primary">Add row</button><button class="clear-rows-btn">Clear</button></div>`;
            container.innerHTML = html;
            container.querySelectorAll('.cell-input').forEach(inp => inp.addEventListener('input', (e) => {
                let row = parseInt(e.target.dataset.row), col = parseInt(e.target.dataset.col);
                if(runtime.rows[row]) runtime.rows[row][col] = e.target.value === "" ? "" : (isNaN(Number(e.target.value)) ? e.target.value : Number(e.target.value));
            }));
            container.querySelectorAll('.remove-row-btn').forEach(btn => btn.addEventListener('click', () => { runtime.rows.splice(parseInt(btn.dataset.row),1); refresh(); }));
            container.querySelector('.add-row-btn')?.addEventListener('click', () => { runtime.rows.push(new Array(ncols).fill("")); refresh(); });
            container.querySelector('.clear-rows-btn')?.addEventListener('click', () => { runtime.rows = []; refresh(); });
        };
        refresh();
    }

    let activeSectionId = SECTIONS[0]?.id || null;
    let searchQuery = "";

    function renderCards() {
        const container = document.getElementById('cardsContainer');
        const section = SECTIONS.find(s => s.id === activeSectionId);
        if (!section) { container.innerHTML = '<div class="empty-state">No section</div>'; return; }
        const filteredParams = getFilteredParams();
        if (filteredParams.length === 0) { container.innerHTML = `<div class="empty-state">No parameters match "${escapeHtml(searchQuery)}"</div>`; return; }
        container.innerHTML = '';
        for (let param of filteredParams) {
            const runtime = globalRuntime[param.id];
            const cardDiv = document.createElement('div');
            cardDiv.className = `param-card ${selectedCardsSet.has(param.id) ? 'selected' : ''}`;
            cardDiv.dataset.paramId = param.id;
            cardDiv.innerHTML = `
                <div class="card-header">
                    <div class="card-header-top">
                        <div class="card-title"><h3>${escapeHtml(param.label || param.id)}</h3></div>
                        <div><span class="card-id">${param.id}</span><span class="badge-type">${param.type}</span></div>
                    </div>
                    <div class="card-desc">${escapeHtml(param.desc || '')}</div>
                </div>
                <div class="card-body" id="body_${param.id}"></div>
            `;
            container.appendChild(cardDiv);
            renderParamBody(param, runtime, cardDiv.querySelector(`#body_${param.id}`));
            
            cardDiv.addEventListener('click', (e) => {
                let target = e.target;
                let isInteractive = target.closest('input, select, button, .cell-input, .select-input, .scalar-input, .reset-btn, .toggle-btn, .add-row-btn, .clear-rows-btn, .remove-row-btn, .bool-group input, label');
                if (!isInteractive) {
                    toggleCardSelection(param.id);
                }
            });
        }
        updateSelectionUI();
    }

    function globalReset() {
        for (let [paramId, { schema }] of allParamsMap.entries()) {
            globalRuntime[paramId] = initParamRuntime(schema);
        }
        renderCards();
    }

    function renderSidebar() {
        const container = document.getElementById('sectionList');
        container.innerHTML = '';
        SECTIONS.forEach(section => {
            const btn = document.createElement('button');
            btn.className = `section-btn ${activeSectionId === section.id ? 'active' : ''}`;
            btn.dataset.sectionId = section.id;
            btn.innerHTML = `<span>${section.name}</span><span class="section-badge">${section.params.length}</span>`;
            btn.addEventListener('click', () => {
                activeSectionId = section.id;
                searchQuery = "";
                document.getElementById('globalSearchInput').value = "";
                renderSidebar();
                document.getElementById('currentSectionTitle').innerText = section.name;
                document.getElementById('currentSectionDesc').innerText = section.description;
                renderCards();
                updateCurrentSectionInfo();
            });
            container.appendChild(btn);
        });
        // Apply selection indicators after building sidebar
        updateSectionIndicators();
    }

    function escapeHtml(str) { if(!str) return ""; return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    function init() {
        renderSidebar();
        if (SECTIONS.length) {
            activeSectionId = SECTIONS[0].id;
            document.getElementById('currentSectionTitle').innerText = SECTIONS[0].name;
            document.getElementById('currentSectionDesc').innerText = SECTIONS[0].description;
        }
        renderCards();
        document.getElementById('globalSearchInput').addEventListener('input', (e) => { searchQuery = e.target.value; renderCards(); });
        document.getElementById('globalResetBtn').addEventListener('click', globalReset);
        document.getElementById('globalExportBtn').addEventListener('click', downloadToml);
        document.getElementById('deselectAllCardsBtn').addEventListener('click', deselectAllCards);
        updateSelectionUI();
    }

    init();
</script>
</body>
</html>
